<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <title>転生したら野良ちいだった｜目次</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
  <main class="home-shell">
    <div class="eyebrow">分岐ＡＤＶ形式の長編ＳＳ</div>
    <header class="cover">
      <span class="cover-line" aria-hidden="true"></span>
      <h1>転生したら<br>野良ちいだった</h1>
    </header>

    <nav class="home-actions" aria-label="読書を始める">
      <a class="action action-primary" href="prologue.html">最初から読む <span aria-hidden="true">→</span></a>
      <a class="action action-secondary" id="continue-link" href="prologue.html" hidden>続きから読む <span aria-hidden="true">→</span></a>
    </nav>

    <section class="menu-section" aria-labelledby="chapters-heading">
      <h2 id="chapters-heading">章一覧</h2>
      <ol class="chapter-list">
        <li><a href="prologue.html"><span class="chapter-number">序章</span><span class="chapter-name">俺、赤糞になってる</span><span class="chapter-arrow" aria-hidden="true">→</span></a></li>
        <li><a href="chapter1.html"><span class="chapter-number">第一章</span><span class="chapter-name">五匹は多すぎる</span><span class="chapter-arrow" aria-hidden="true">→</span></a></li>
      </ol>
      <p class="section-note">第２章以降は、この試作では未実装です。</p>
    </section>

    <section class="menu-section menu-section-last" aria-labelledby="ends-heading">
      <h2 id="ends-heading">ＥＮＤ ＬＩＳＴ</h2>
      <p class="section-note" id="end-01-unread">ＢＡＤ ＥＮＤ ０１　未読</p>
      <a class="ending-entry" id="end-01-link" href="bad-end-01.html" hidden>ＢＡＤ ＥＮＤ ０１　選別 <span aria-hidden="true">→</span></a>
      <p class="section-note">その他の結末は、この試作では未実装です。</p>
    </section>
    <div class="menu-reset">
      <button class="reset-button" type="button" id="reset-history">読書記録を消去</button>
      <p class="section-note">続きから読む・選択履歴・ＥＮＤ ＬＩＳＴの記録を消します。</p>
    </div>
  </main>
  <script>
    const key = 'tensei-chii-progress-v1';
    const link = document.getElementById('continue-link');
    try {
      const progress = JSON.parse(localStorage.getItem(key) || 'null');
      if (progress && ['prologue.html', 'chapter1.html', 'bad-end-01.html'].includes(progress.page) && Number.isFinite(progress.y)) {
        link.href = progress.page + '#continue';
        link.hidden = false;
      }
      if (localStorage.getItem('tensei-chii-end-01-seen-v1') === '1') {
        document.getElementById('end-01-unread').hidden = true;
        document.getElementById('end-01-link').hidden = false;
      }
    } catch (_) { /* 閲覧は保存機能なしでも可能 */ }
    document.getElementById('reset-history').addEventListener('click', () => {
      if (!confirm('続きから読む・選択履歴・ＥＮＤ ＬＩＳＴの記録をすべて消去しますか？')) return;
      try {
        ['tensei-chii-progress-v1', 'tensei-chii-chapter1-choice-v1', 'tensei-chii-end-01-seen-v1']
          .forEach(name => localStorage.removeItem(name));
        location.reload();
      } catch (_) {
        alert('記録を消去できませんでした。ブラウザの保存設定を確認してください。');
      }
    });
  </script>
</body>
</html>
