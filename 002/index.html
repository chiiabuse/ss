<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>転生したら野良ちいだった｜目次</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="home-page">
    <main class="home-shell">
      <div class="eyebrow">分岐ＡＤＶ形式の長編ＳＳ</div>
      <header class="cover">
        <span class="cover-line" aria-hidden="true"></span>
        <h1>転生したら<br />野良ちいだった</h1>
        <p class="cover-copy">
          会社帰りの事故。目が覚めた俺は、野良ちいの赤ベビになっていた。
        </p>
      </header>

      <nav class="home-actions" aria-label="読書を始める">
        <a class="action action-primary" href="prologue.html"
          >最初から読む <span aria-hidden="true">→</span></a
        >
        <a
          class="action action-secondary"
          id="continue-link"
          href="prologue.html"
          hidden
          >続きから読む <span aria-hidden="true">→</span></a
        >
      </nav>

      <section class="menu-section" aria-labelledby="chapters-heading">
        <h2 id="chapters-heading">章一覧</h2>
        <ol class="chapter-list">
          <li>
            <a href="prologue.html"
              ><span class="chapter-number">序章</span
              ><span class="chapter-name">俺、赤糞になってる</span
              ><span class="chapter-arrow" aria-hidden="true">→</span></a
            >
          </li>
        </ol>
        <p class="section-note">第１章以降は、この試作では未実装です。</p>
      </section>

      <section
        class="menu-section menu-section-last"
        aria-labelledby="ends-heading"
      >
        <h2 id="ends-heading">ＥＮＤ ＬＩＳＴ</h2>
        <p class="section-note">
          ＢＡＤ ＥＮＤ ０１〜０６／ＥＮＤ
          Ａ・Ｂは、本文を組み込む段階で追加します。
        </p>
      </section>
    </main>
    <script>
      const key = "tensei-chii-progress-v1";
      const link = document.getElementById("continue-link");
      try {
        const progress = JSON.parse(localStorage.getItem(key) || "null");
        if (
          progress &&
          progress.page === "prologue.html" &&
          Number.isFinite(progress.y)
        ) {
          link.href = "prologue.html#continue";
          link.hidden = false;
        }
      } catch (_) {
        /* 閲覧は保存機能なしでも可能 */
      }
    </script>
  </body>
</html>
